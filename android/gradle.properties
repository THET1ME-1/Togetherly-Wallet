# Потолок памяти держим низким осознанно: на машине 14 ГБ, и рядом с
# эмулятором сборка с -Xmx8G уходила под oom-killer (код 144, поймано
# 12.09.2026). Тот же случай уже разбирался в Togetherly.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=3
org.gradle.parallel=false
android.useAndroidX=true

name: TestFlight

# Сборка iOS с подписью и отправка в TestFlight. Устроено как в Togetherly:
# подпись делает codemagic-cli-tools по ключу App Store Connect API, сам
# создаёт или докачивает профиль App Store и переиспользует сертификат
# дистрибуции команды по постоянному приватному ключу.
#
# Секреты:
#   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
#   APP_STORE_CONNECT_PRIVATE_KEY — ключ API (.p8 целиком, как есть);
#   CERTIFICATE_PRIVATE_KEY — приватный RSA-ключ сертификата, base64 в строку;
#   TESSERA_KEY, BUGSINK_DSN — аналитика и падения.
#
# Номер сборки берётся из pubspec, тот же, что у Android. Если в ASC уже есть
# номер не меньше — берётся следующий: повторный Apple не примет.
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  testflight:
    name: IPA в TestFlight
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      BUNDLE_ID: com.togetherly.money
      APP_STORE_APP_ID: '6812830330'
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли ключи Apple
        run: |
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "Нет секрета $v"; exit 1; fi
          done

      - name: Самый свежий Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$newest" ] && newest=/Applications/Xcode.app
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: codemagic-cli-tools
        run: |
          python3 -m pip install --quiet codemagic-cli-tools \
            || python3 -m pip install --quiet --break-system-packages codemagic-cli-tools
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Пакеты и поды
        run: |
          flutter pub get
          cd ios && pod install

      - name: Подпись
        # use-profiles переводит проект на ручную подпись и пишет
        # ~/export_options.plist: на безголовом Mac автоматическая подпись
        # падает с «No Accounts».
        run: |
          set -euo pipefail
          keychain initialize
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > "$RUNNER_TEMP/cert_key.pem"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$RUNNER_TEMP/cert_key.pem" \
            --create
          keychain add-certificates
          xcode-project use-profiles
          rm -f "$RUNNER_TEMP/cert_key.pem"

      - name: Сборка IPA
        run: |
          set -euo pipefail
          latest=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          [ -z "$latest" ] && latest=0
          build=$(grep -m1 '^version:' pubspec.yaml | sed 's/.*+//')
          if [ "$latest" -ge "$build" ]; then build=$((latest + 1)); fi
          echo "В ASC последний $latest, собираем $build"
          flutter build ipa --release \
            --dart-define=STORE=appstore \
            --dart-define=TESSERA_KEY=${{ secrets.TESSERA_KEY }} \
            --dart-define=BUGSINK_DSN=${{ secrets.BUGSINK_DSN }} \
            --build-number="$build" \
            --export-options-plist="$HOME/export_options.plist"

      - name: Отправка в TestFlight
        run: app-store-connect publish --path "build/ios/ipa/*.ipa"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: ignore
